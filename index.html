    <meta charset="UTF-8" />
    <script>
      (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('auth_email');
        const pass = urlParams.get('auth_pass');
        if (email && pass) {
          window.__agentEmail = email;
          window.__agentPass = pass;
        }
      })();
    </script>
